  <g id="text_25">
   <text style="fill: #626d7a; font: 9px 'DejaVu Sans'" transform="translate(15.84 524.43952)">Other time = recorded elapsed time minus API latency: simulation, rendering, observation processing and logging.</text>
   <text style="fill: #626d7a; font: 9px 'DejaVu Sans'" transform="translate(15.84 536.2272)">API time includes network/provider waiting; the total-time SD is computed from episode totals. Task 4: retained run set.</text>
  </g>
